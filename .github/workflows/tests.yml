name: tests

# Se testean Laravel 12.x y 13.x. No se testea Laravel 11: Packagist marca
# con avisos de seguridad TODAS las versiones de laravel/framework por debajo de la 12.60 (CVE-2026-48019),
# así que Composer no puede resolver una instalación limpia de Laravel 10/11
# en un runner con una versión reciente de Composer. El paquete declara
# soporte para Laravel 11 en composer.json (nada en el código es
# incompatible), pero no se puede verificar en CI mientras esa versión siga
# marcada. Revisar y ampliar la matriz cuando deje de estarlo.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3]
        laravel: ['12.*']
        include:
          # Laravel 13 exige PHP 8.3+.
          - php: 8.3
            laravel: '13.*'

    name: PHP ${{ matrix.php }} — Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" "illuminate/contracts:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Run tests
        run: vendor/bin/phpunit
