name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: 8.1
            laravel: 10.*
            testbench: ^8.20
          - php: 8.2
            laravel: 10.*
            testbench: ^8.20
          - php: 8.3
            laravel: 10.*
            testbench: ^8.20
          - php: 8.2
            laravel: 11.*
            testbench: ^9.5
          - php: 8.3
            laravel: 11.*
            testbench: ^9.5
          - php: 8.2
            laravel: 12.*
            testbench: 10.*
          - php: 8.3
            laravel: 12.*
            testbench: 10.*

    name: PHP ${{ matrix.php }} — Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts=${{ matrix.laravel }}" "orchestra/testbench=${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress --no-audit

      - name: Run tests
        run: vendor/bin/phpunit
